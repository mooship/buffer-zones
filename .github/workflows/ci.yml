name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            data-pipeline/package-lock.json
      - run: npm ci
      - run: npm ci --prefix data-pipeline
      - run: npm run cache:prune --prefix data-pipeline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run validate --prefix data-pipeline
      - run: npm run build
